<!DOCTYPE html>
<html>
<head>
    <title>Uppmärksamhetstest</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { border: 2px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        #ui { position: absolute; top: 20px; left: 20px; background: white; padding: 15px; border-radius: 8px; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    let ballCount = 5;
    let greenBounces = 0;
    let backgroundHue = 210; // Startar på blått (0-360)
    let intruderX = -100;
    let balls = [];
    let testActive = false;

    class Ball {
        constructor(x, y, dx, dy, color, isTarget) {
            this.x = x; this.y = y; this.dx = dx; this.dy = dy;
            this.color = color; this.isTarget = isTarget;
            this.radius = 15;
        }

        update() {
            this.x += this.dx;
            this.y += this.dy;

            if (this.x - this.radius <= 0 || this.x + this.radius >= canvas.width) {
                this.dx *= -1;
                if (this.isTarget) greenBounces++;
            }
            if (this.y - this.radius <= 0 || this.y + this.radius >= canvas.height) {
                this.dy *= -1;
                if (this.isTarget) greenBounces++;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            
            if (this.isTarget) {
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            } else {
                // Förändringsblindhet: Bollarna blir gradvis fyrkantiga
                let progress = Math.min(1, (backgroundHue - 210) / 60);
                let size = this.radius * 2;
                if (progress < 0.5) {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                } else {
                    ctx.rect(this.x - this.radius, this.y - this.radius, size, size);
                }
            }
            ctx.fill();
        }
    }

    function init() {
        balls.push(new Ball(100, 100, 4, 5, 'green', true));
        for (let i = 0; i < ballCount - 1; i++) {
            balls.push(new Ball(Math.random() * 700, Math.random() * 500, Math.random() * 4 + 2, Math.random() * 4 + 2, 'white', false));
        }
        
        alert("UPPGIFT: Räkna hur många gånger den GRÖNA bollen studsar mot väggarna.\nTestet tar 15 sekunder.");
        testActive = true;
        
        setTimeout(finishTest, 15000);
        animate();
    }

    function finishTest() {
        testActive = false;
        alert(`Testet klart!\n\nDin räkning: ${greenBounces} studsar.\n\nMärkte du att:\n1. Bakgrunden blev rosa?\n2. En grå fyrkant åkte förbi?`);
        location.reload();
    }

    function animate() {
        if (!testActive) return;

        // 1. Bakgrund (Change Blindness)
        backgroundHue += 0.1;
        ctx.fillStyle = `hsl(${backgroundHue}, 50%, 80%)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Inkräktare (Inattentional Blindness)
        ctx.fillStyle = 'rgba(150, 150, 150, 0.4)';
        ctx.fillRect(intruderX, 250, 80, 80);
        intruderX += 1.5;

        // 3. Bollar
        balls.forEach(b => {
            b.update();
            b.draw();
        });

        requestAnimationFrame(animate);
    }

    init();
</script>
</body>
</html>
